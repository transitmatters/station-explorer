name: lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Set up Node, Python, and uv via mise
        uses: jdx/mise-action@v5
      - name: Lint frontend code with ESLint
        run: |
          npm ci
          npm run lint-frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Set up Node, Python, and uv via mise
        uses: jdx/mise-action@v5
      - name: Lint backend code with Ruff
        run: |
          npm ci
          npm run lint-backend
