[tool.poetry]
name = "station-explorer"
version = "0.0.1"
description = "Backend to fetch data from the stations of the MBTA"
authors = ["TransitMatters Labs Team"]
license = "MIT"

[tool.poetry.dependencies]
python = "~3.12"
requests = "~2.32.3"
aiohttp = "3.9.5"
json-api-doc = "0.15.0"
boto3 = "^1.34.140"
pytz = "2024.1"
datadog_lambda = "6.96.0"

[tool.poetry.dev-dependencies]
pip = ">=24.0"
chalice = "1.31.2"
flake8 = "^7.1.0"
black = "^24.4.2"

[tool.black]
line-length = 120
target-version = ['py312']

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"