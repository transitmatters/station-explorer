[project]
name = "station-explorer"
version = "0.0.1"
description = "Backend to fetch data from the stations of the MBTA"
authors = [{ name = "TransitMatters Labs Team" }]
license = "MIT"
requires-python = "~=3.13.0"
dependencies = [
    "requests~=2.34.2",
    "aiohttp==3.14.5",
    "json-api-doc==0.15.0",
    "boto3>=1.43.123,<2",
    "pytz==2026.6",
    "datadog_lambda==8.130.0",
    "certifi>=2026.10.23",
]

[dependency-groups]
dev = [
    # chalice package needs pip in the virtualenv to build the Lambda bundle
    "pip>=26.2",
    "chalice==1.34.0",
    "ruff>=0.17.3",
    "pre-commit>=4.7.0",
]

[tool.uv]
package = false
