[tool.poetry]
name = "station-explorer"
version = "0.0.1"
description = "Backend to fetch data from the stations of the MBTA"
authors = ["TransitMatters Labs Team"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "~3.12"
requests = "~2.32.4"
aiohttp = "3.11.18"
json-api-doc = "0.15.0"
boto3 = "^1.38.12"
pytz = "2025.2"
datadog_lambda = "6.108.0"

[tool.poetry.group.dev.dependencies]
pip = ">=24.1"
chalice = "1.31.4"
flake8 = "^7.2.0"
black = "^25.1.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = "^1.9.0"

[tool.black]
line-length = 120
target-version = ['py312']

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"