<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="author" content="TransitMatters" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@transitmatters" />
    <meta name="twitter:title" content="Station Explorer" />
    <meta name="twitter:description" content="Explore and see details about the MBTA's stations" />
    <link rel="manifest" href="/manifest.json" />
    <title>Station Explorer</title>
    <script>
      if (
        localStorage.getItem('darkMode') ||
        (!('darkMode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
